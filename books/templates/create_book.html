<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Livro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .errorlist {
            color: red;
            margin: 5px 0;
            font-size: 0.9em;
            list-style: none;
            padding: 0;
        }

        .button-primary {
            width: 100%;
            padding: 10px;
            background-color: #2c7be5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .button-primary:hover {
            background-color: #1a68d1;
        }

        .button-secondary {
            display: block;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            background-color: #6c757d;
            color: white;
            border-radius: 4px;
            text-decoration: none;
        }

        .button-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cadastrar Livro</h2>

    <form method="post">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <ul class="errorlist">
                {% for error in form.non_field_errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <div class="form-group">
            <label for="id_name">Nome do Livro</label>
            {{ form.name }}
            {{ form.name.errors }}
        </div>

        <div class="form-group">
            <label for="id_quantity_of_pages">Quantidade de Páginas</label>
            {{ form.quantity_of_pages }}
            {{ form.quantity_of_pages.errors }}
        </div>

        <button type="submit" class="button-primary">Salvar</button>
    </form>

    <a href="{% url 'books' %}" class="button-secondary">
        Voltar para listagem
    </a>
</div>

</body>
</html>
