<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Detail</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 6px;
            width: 400px;
            background-color: #f9f9f9;
        }

        .field {
            margin-bottom: 15px;
        }

        .label {
            font-weight: bold;
        }

        .buttons {
            margin-top: 20px;
        }

        .button {
            display: inline-block;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            margin-right: 10px;
        }

        .btn-edit {
            background-color: #ffc107;
            color: black;
        }

        .btn-edit:hover {
            background-color: #e0a800;
        }

        .btn-back {
            background-color: #6c757d;
        }

        .btn-back:hover {
            background-color: #5a6268;
        }

        .messages {
            margin-bottom: 20px;
            color: green;
        }
    </style>
</head>
<body>

    <h1>Book Detail</h1>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <div class="card">
        <div class="field">
            <span class="label">Name:</span><br>
            {{ book.name }}
        </div>

        <div class="field">
            <span class="label">Quantity of Pages:</span><br>
            {{ book.quantity_of_pages }}
        </div>
    </div>

    <div class="buttons">
        <a href="{% url 'update_book' book.pk %}" class="button btn-edit">
            Edit
        </a>

        <a href="{% url 'books' %}" class="button btn-back">
            Back to list
        </a>
    </div>

</body>
</html>
